<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loader-overlay" id="pageLoader">
  <div class="spinner" aria-hidden="true"></div>
  <span class="loader-text">Loading market data…</span>
</div>

<div class="board">

  <nav class="nav">
    <a href="index.html" class="nav__link nav__link--active">Market</a>
    <a href="trade.html" class="nav__link">Paper Trading</a>
  </nav>

  <header class="board__header">
    <div class="brand">
      <span class="brand__eyebrow">Market Watch</span>
      <span class="brand__sub" id="tickerCount">— names tracked</span>
    </div>
    <div class="header__right">
      <span class="updated" id="updatedAt">checking…</span>
      <button class="refresh-btn" id="refreshBtn" type="button">Refresh</button>
    </div>
  </header>

  <section class="hero" id="hero" aria-live="polite">
    <div class="hero__arrow" id="heroArrow">—</div>
    <div class="hero__value" id="heroValue">--.-%</div>
    <div class="hero__caption" id="heroCaption">loading today's move…</div>
    <div class="hero__tier" id="heroTier" hidden></div>
  </section>

  <section class="section">
    <div class="section__label">
      <span>Tickers</span>
      <span class="legend"><i class="dot dot--up"></i>up <i class="dot dot--down"></i>down</span>
    </div>
    <div class="flap-grid" id="flapGrid" role="list"></div>
  </section>

  <section class="section">
    <div class="section__label"><span>Daily log</span></div>
    <ul class="ledger" id="ledger"></ul>
  </section>

  <footer class="board__footer">
    <span>Data delayed ~15 min · refreshes automatically every 5 min</span>
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
