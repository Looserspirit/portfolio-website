<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Watch — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Custom CSS file for Market Index page -->
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loader-overlay" id="pageLoader">
  <div class="spinner" aria-hidden="true"></div>
  <span class="loader-text">Loading market data…</span>
</div>

<div class="board">

  <header class="top-bar">
    <div class="brand">
      <span class="brand__eyebrow">Market Watch</span>
    </div>

    <div class="user-actions">
      <a href="trade.html" class="nav-btn">Demo / Paper Trading</a>

      <div class="notif-wrapper">
        <button class="icon-btn" id="notifBtn" aria-label="Notifications">
          🔔
          <span class="unread-dot" id="unreadDot"></span>
        </button>
        <div class="notif-dropdown" id="notifDropdown" hidden>
          <div class="notif-header">Notifications</div>
          <ul class="notif-list">
            <li><strong>Alert:</strong> Tech stocks show strong upward trend.</li>
            <li><strong>Watchlist:</strong> NVDA hits high mark today.</li>
          </ul>
        </div>
      </div>

      <div class="profile-wrapper">
        <button class="icon-btn" id="profileBtn" aria-label="Account">👤</button>
        <div class="profile-dropdown" id="profileDropdown" hidden>
          <p id="profileUserDisplay">User: --</p>
          <hr/>
          <button id="switchUserBtn" class="dropdown-btn">Switch Profile</button>
          <button id="logoutBtn" class="dropdown-btn dropdown-btn--danger">Log Out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="categoryContainer"></main>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
