<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paper Trading — Market Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="loader-overlay" id="pageLoader">
  <div class="spinner" aria-hidden="true"></div>
  <span class="loader-text">Loading trading platform…</span>
</div>

<div class="board">

  <div class="top-bar">
    <a href="index.html" class="nav-btn">← Back to Market</a>
    <button id="resetBtn" class="btn" hidden>Reset Portfolio</button>
  </div>

  <section class="section" id="setupPanel">
    <div class="section__label">Setup Demo Account</div>
    <p>How much demo money would you like to start with?</p>
    <div style="display: flex; gap: 10px; margin-top: 12px;">
      <input type="number" id="startingBalanceInput" class="input" placeholder="e.g. 10000" min="1" />
      <button class="btn btn--up" id="startBtn">Add Funds &amp; Start</button>
    </div>
  </section>

  <div id="portfolioView" hidden>
    <section class="section">
      <div class="section__label">Account Summary</div>
      <p>Cash: <strong id="statCash">$0.00</strong> | Holdings: <strong id="statHoldings">$0.00</strong> | Total: <strong id="statTotal">$0.00</strong> | P&amp;L: <strong id="statPnl">$0.00</strong></p>
    </section>

    <section class="section">
      <div class="section__label">Place Order</div>
      <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
        <select id="tickerSelect" class="input"></select>
        <span id="selectedPrice" style="font-family: var(--font-mono);">$0.00</span>
        <input type="number" id="qtyInput" class="input" min="1" value="1" style="width: 80px;" />
        <button class="btn btn--up" id="buyBtn">Buy</button>
        <button class="btn btn--down" id="sellBtn">Sell</button>
      </div>
    </section>

    <section class="section">
      <div class="section__label">Your Holdings</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Symbol</th><th>Qty</th><th>Avg Cost</th><th>Price</th><th>Total Value</th></tr>
          </thead>
          <tbody id="holdingsBody"></tbody>
        </table>
      </div>
    </section>
  </div>

</div>

<script src="data.js"></script>
<script src="trade.js"></script>
</body>
</html>
